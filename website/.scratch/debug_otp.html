<!doctype html><meta charset="utf-8">
<iframe id="f" src="../daftar.html" style="width:100%;height:800px"></iframe>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
window.onload = async () => {
  const f = document.getElementById('f');
  const d = f.contentDocument;
  const w = f.contentWindow;
  w.addEventListener('error', e => console.log('WIN ERR:', e.message));
  await sleep(500);
  console.log('Step title:', d.getElementById('step-title')?.textContent);
  const inp = d.querySelector('#phone');
  console.log('Phone input exists:', !!inp);
  inp.value = '081234567890';
  inp.dispatchEvent(new w.Event('input', { bubbles: true }));
  const btn = d.querySelector('#phone-send');
  console.log('Send button exists:', !!btn);
  btn.click();
  console.log('Button clicked. Waiting 1s...');
  await sleep(1000);
  console.log('OTP boxes count:', d.querySelectorAll('.otp input').length);
  console.log('Body text snippet:', d.body.innerText.slice(0, 300));
};
</script>
