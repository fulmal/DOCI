<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Menjadi Member DOCI — Formulir Bertahap & Pembayaran Otomatis</title>
  <meta name="description" content="Daftar menjadi member DOCI dalam 6 langkah: verifikasi nomor, data pribadi, kendaraan, chapter & dokumen, persetujuan, lalu bayar otomatis.">
  <meta name="theme-color" content="#D5001C">
  <link rel="icon" href="assets/img/favicon.png" type="image/png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Open+Sans:wght@400;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/doci.css"><link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="membership">
  <div id="site-header"></div>
  <main id="main" style="background:var(--color-cloud-100);padding:var(--space-5) 0 var(--space-8)">
    <div class="container form-shell">
      <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="index.html">Beranda</a></li><li><a href="membership.html">Keanggotaan</a></li><li><span aria-current="page">Pendaftaran Member</span></li></ol></nav>
      <div class="stepper" aria-label="Progres pendaftaran">
        <div class="stepper__bar" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" id="sp-bar"><span></span></div>
        <div class="stepper__label"><span id="sp-label"></span><span id="draft-label" aria-live="polite"></span></div>
        <ol class="stepper__dots" id="sp-dots"></ol>
      </div>

      <div class="card" id="step-card">
        <h1 id="step-title" style="font-size:24px"></h1>
        <p class="muted" id="step-desc"></p>
        <form id="step-form" novalidate></form>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/otp.js?v=otp3"></script>
  <script>
    (function () {
      const { D, icon, esc, fmt, Store, Auth, toast, OtpFlow, Audit, confirmDialog } = DOCI;
      if (Auth.current() && Auth.current().status === 'aktif') { /* member aktif boleh melihat; tetap lanjut untuk demo */ }
      const STEPS = [
        { t: 'Verifikasi Nomor Telepon', s: 'Nomor telepon menjadi identitas utama akun Anda.', short: 'Verifikasi' },
        { t: 'Data Pribadi', s: 'Isi data sesuai identitas. Hanya data yang benar-benar diperlukan.', short: 'Data Pribadi' },
        { t: 'Data Kendaraan', s: 'Beritahu kami Ducati yang Anda kendarai.', short: 'Kendaraan' },
        { t: 'Chapter & Dokumen', s: 'Pilih chapter terdekat dan unggah dokumen persyaratan.', short: 'Chapter & Dokumen' },
        { t: 'Persetujuan', s: 'Baca dan setujui ketentuan berikut untuk melanjutkan.', short: 'Persetujuan' },
        { t: 'Ringkasan & Biaya', s: 'Periksa kembali data Anda sebelum membayar.', short: 'Bayar' }
      ];
      let draft = Store.get('draft', { step: 0, phone: null, data: {}, files: {}, agree: {}, vehicles: [] });
      const form = document.getElementById('step-form');
      const save = () => { Store.set('draft', draft); document.getElementById('draft-label').textContent = 'Draft tersimpan ' + fmt.time(new Date()).replace(' WIB', ''); };
      const dots = document.getElementById('sp-dots');
      dots.innerHTML = STEPS.map((s, i) => `<li><span class="n">${i + 1}</span>${s.short}</li>`).join('');

      const fieldErr = (el, msg) => { const f = el.closest('.field'); if (!f) return; f.classList.toggle('has-error', !!msg); const e = f.querySelector('.error-text span'); if (e && msg) e.textContent = msg; el.setAttribute('aria-invalid', !!msg); };
      const F = (id, label, { type = 'text', req = true, ph = '', help = '', value = '', ac = '', attrs = '' } = {}) => `
        <div class="field"><label for="${id}">${label}${req ? '<span class="req" aria-hidden="true">*</span>' : ' <span class="muted small">(opsional)</span>'}</label>
        <input class="input" id="${id}" name="${id}" type="${type}" placeholder="${ph}" value="${esc(value)}" ${req ? 'required' : ''} ${ac ? `autocomplete="${ac}"` : ''} aria-describedby="${id}-e ${help ? id + '-h' : ''}" ${attrs}>
        ${help ? `<span class="help" id="${id}-h">${help}</span>` : ''}<span class="error-text" id="${id}-e" role="alert">${icon('alert', 'icon--16')}<span></span></span></div>`;
      const d = () => draft.data;

      function render() {
        const i = draft.step, S = STEPS[i];
        document.getElementById('step-title').textContent = S.t;
        document.getElementById('step-desc').textContent = S.s;
        document.getElementById('sp-label').innerHTML = `<b>${i + 1} dari 6</b> — ${S.short}`;
        const bar = document.getElementById('sp-bar'); bar.setAttribute('aria-valuenow', i + 1); bar.firstElementChild.style.width = ((i + 1) / 6 * 100) + '%';
        dots.querySelectorAll('li').forEach((li, k) => { li.classList.toggle('is-done', k < i); li.classList.toggle('is-current', k === i); li.querySelector('.n').innerHTML = k < i ? icon('check', 'icon--16') : (k + 1); });
        window.scrollTo({ top: 0, behavior: 'smooth' });
        form.innerHTML = ''; form.onsubmit = null; form.oninput = null; form.onclick = null; form.onchange = null;
        ({ 0: s0, 1: s1, 2: s2, 3: s3, 4: s4, 5: s5 })[i]();
        document.getElementById('step-title').focus?.();
      }

      const nav = (last = false, label = 'Lanjutkan') => `<div class="form-actions form-actions--sticky"><button type="button" class="btn btn--ghost" data-back ${draft.step === 0 ? 'hidden' : ''}>${icon('chev-left', 'icon--16')}Kembali</button><button class="btn ${last ? 'btn--lg' : ''}" type="submit">${label}</button></div>`;
      const wireNav = (validate) => {
        form.querySelector('[data-back]')?.addEventListener('click', () => { collect(); draft.step--; save(); render(); });
        form.oninput = (e) => { collect(); save(); if (e.target.closest('.field')?.classList.contains('has-error')) fieldErr(e.target, ''); };
        form.onsubmit = (e) => { e.preventDefault(); collect(); if (validate()) { draft.step++; save(); render(); } else { const bad = form.querySelector('.has-error input, .has-error select, .has-error textarea, .has-error [type=checkbox]'); bad?.focus(); toast({ type: 'warning', msg: 'Ada isian yang perlu dilengkapi. Cek kolom bertanda merah ya.' }); } };
      };
      const collect = () => { form.querySelectorAll('input:not([type=file]):not([type=checkbox]), select, textarea').forEach(el => { if (el.name) draft.data[el.name] = el.value; }); form.querySelectorAll('input[type=checkbox][name]').forEach(el => { draft.agree[el.name] = el.checked; }); };
      const req = (id, msg, test) => { const el = form.querySelector('#' + id); const v = (el.value || '').trim(); const bad = !v || (test && !test(v)); fieldErr(el, bad ? (v ? test.msg || msg : msg) : ''); return !bad; };

      /* Step 1 — OTP */
      function s0() {
        form.onsubmit = (e) => e.preventDefault();
        if (draft.phone) {
          form.innerHTML = `<div class="banner banner--success">${icon('check-circle')}<div><b>Nomor terverifikasi</b><span class="mono">${fmt.phone(draft.phone)}</span></div></div>
            <div class="form-actions"><button type="button" class="btn btn--ghost" id="chg">Ganti nomor</button><button class="btn" type="button" id="go">Lanjutkan</button></div>`;
          form.querySelector('#go').onclick = () => { draft.step = 1; save(); render(); };
          form.querySelector('#chg').onclick = () => { draft.phone = null; save(); render(); };
          return;
        }
        form.innerHTML = `<div class="banner banner--demo demo-hint small" style="margin-bottom:16px">${icon('shield')}<div><b>Petunjuk Pendaftaran Demo</b> Masukkan nomor ponsel baru (mis. <code>081234567890</code>). Gunakan kode OTP <code>123456</code>. (Nomor demo <code>0812-0000-0001..3</code> sudah terdaftar).</div></div><div id="otp-root"></div>`;
        OtpFlow({ root: form.querySelector('#otp-root'), mode: 'signup', cta: 'Kirim OTP', onVerified(p) { draft.phone = p; draft.step = 1; save(); render(); } });
      }
      /* Step 2 — pribadi */
      function s1() {
        form.innerHTML = F('fullName', 'Nama lengkap (sesuai KTP)', { ac: 'name', value: d().fullName || '', ph: 'mis. Raka Pratama' }) +
          `<div class="form-row form-row--2">${F('birth', 'Tanggal lahir', { type: 'date', value: d().birth || '', ac: 'bday' })}${F('city', 'Kota domisili', { value: d().city || '', ph: 'mis. Jakarta Selatan', ac: 'address-level2' })}</div>` +
          F('email', 'Email', { type: 'email', req: false, value: d().email || '', ph: 'nama@email.com', ac: 'email', help: 'Untuk invoice & pemulihan akun. Direkomendasikan.' }) +
          `<div class="field"><label for="photo">Foto profil <span class="muted small">(opsional)</span></label><input class="input" type="file" id="photo" accept="image/png,image/jpeg,image/webp"><span class="help">JPG/PNG/WebP, maks 5 MB.</span></div>` + nav();
        wireNav(() => {
          let ok = true;
          ok = req('fullName', 'Nama lengkap wajib diisi.', Object.assign(v => v.length >= 3, { msg: 'Nama minimal 3 huruf.' })) && ok;
          const b = form.querySelector('#birth'); const age = (Date.now() - new Date(b.value)) / 31557600000;
          if (!b.value) { fieldErr(b, 'Tanggal lahir wajib diisi.'); ok = false; } else if (age < 17) { fieldErr(b, 'Usia minimal 17 tahun untuk bergabung.'); ok = false; }
          ok = req('city', 'Kota domisili wajib diisi.') && ok;
          const em = form.querySelector('#email'); if (em.value && !/^\S+@\S+\.\S+$/.test(em.value)) { fieldErr(em, 'Format email belum sesuai, mis. nama@email.com.'); ok = false; }
          return ok;
        });
      }
      /* Step 3 — kendaraan (boleh lebih dari satu) + validasi foto STNK */
      const MODELS = ['Panigale V4', 'Panigale V2', 'Streetfighter V4', 'Streetfighter V2', 'Monster', 'Multistrada V4', 'DesertX', 'Hypermotard', 'Diavel V4', 'SuperSport', 'Scrambler', 'Lainnya'];
      const MAX_VEH = 5;
      const STNK_RULE = { maxBytes: 5 * 1024 * 1024, minBytes: 15 * 1024, minShort: 480, minLong: 800 };
      const newVeh = () => ({ id: 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), model: '', year: '', color: '', plate: '', chassis: '', engine: '', stnk: null });
      const plateKey = (p) => String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      const plateOk = (p) => /^[A-Z]{1,2}\d{1,4}[A-Z]{0,3}$/.test(plateKey(p));
      const plateFmt = (p) => { const m = plateKey(p).match(/^([A-Z]{1,2})(\d{1,4})([A-Z]{0,3})$/); return m ? [m[1], m[2], m[3]].filter(Boolean).join(' ') : String(p || '').toUpperCase().trim(); };
      function vehicles() {
        if (!Array.isArray(draft.vehicles) || !draft.vehicles.length) {
          const o = d(), v = newVeh(); /* migrasi draft lama (1 kendaraan) */
          if (o.model) Object.assign(v, { model: o.model, year: o.year || '', color: o.color || '', plate: o.plate || '', chassis: o.chassis || '', engine: o.engine || '' });
          draft.vehicles = [v];
        }
        return draft.vehicles;
      }
      const bikeLabel = (v) => `Ducati ${v.model || '—'}${v.year ? ' (' + v.year + (v.color ? ', ' + v.color : '') + ')' : ''}`;

      /* Pemeriksaan awal foto STNK — murni di perangkat (tanpa OCR/server). */
      async function checkStnk(file) {
        const mb = (file.size / 1048576).toFixed(1);
        if (/heic|heif/i.test(file.type) || /\.(heic|heif)$/i.test(file.name)) return { error: 'Format HEIC belum didukung. Ubah kamera ke "Paling Kompatibel" (JPG) atau ekspor sebagai JPG.' };
        if (file.size > STNK_RULE.maxBytes) return { error: `Ukuran foto ${mb} MB melebihi batas 5 MB. Kecilkan resolusi atau kompres dulu ya.` };
        if (file.size < STNK_RULE.minBytes) return { error: 'Berkas terlalu kecil untuk foto dokumen. Gunakan foto asli STNK, bukan tangkapan layar kecil.' };
        const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
        const isJpg = head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF, isPng = head[0] === 0x89 && head[1] === 0x50 && head[2] === 0x4E && head[3] === 0x47;
        if (!isJpg && !isPng) return { error: file.type === 'application/pdf' ? 'STNK harus berupa foto (JPG/PNG), bukan PDF.' : 'Isi berkas bukan foto JPG/PNG yang valid. Coba foto ulang STNK Anda.' };
        const url = URL.createObjectURL(file);
        try {
          const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }).catch(() => null);
          if (!im) return { error: 'Foto tidak bisa dibuka — berkas mungkin rusak. Coba foto ulang.' };
          const w = im.naturalWidth, h = im.naturalHeight, short = Math.min(w, h), long = Math.max(w, h);
          if (short < STNK_RULE.minShort || long < STNK_RULE.minLong) return { error: `Resolusi ${w}×${h} px terlalu kecil. Minimal ${STNK_RULE.minLong}×${STNK_RULE.minShort} px agar tulisan terbaca.` };
          if (long / short > 3) return { error: 'Bentuk foto terlalu memanjang untuk dokumen STNK. Foto seluruh lembar STNK dari atas.' };
          /* analisis kecerahan, kontras, ketajaman pada versi 400 px */
          const sc = Math.min(1, 400 / long), cw = Math.max(8, Math.round(w * sc)), ch = Math.max(8, Math.round(h * sc));
          const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(im, 0, 0, cw, ch);
          const px = cx.getImageData(0, 0, cw, ch).data, n = cw * ch, g = new Float32Array(n); let sum = 0;
          for (let i = 0, j = 0; i < n; i++, j += 4) { const v = 0.299 * px[j] + 0.587 * px[j + 1] + 0.114 * px[j + 2]; g[i] = v; sum += v; }
          const mean = sum / n; let vs = 0; for (let i = 0; i < n; i++) vs += (g[i] - mean) * (g[i] - mean); const std = Math.sqrt(vs / n);
          if (mean < 50) return { error: 'Foto terlalu gelap. Foto ulang di tempat yang lebih terang.' };
          if (mean > 238) return { error: 'Foto terlalu terang/silau sehingga tulisan hilang. Hindari pantulan lampu atau flash.' };
          if (std < 14) return { error: 'Foto nyaris polos — dokumen tidak terlihat. Pastikan STNK ada di dalam bingkai.' };
          let ls = 0, lq = 0, lc = 0; for (let y = 1; y < ch - 1; y++) for (let x = 1; x < cw - 1; x++) { const c = y * cw + x, l = 4 * g[c] - g[c - 1] - g[c + 1] - g[c - cw] - g[c + cw]; ls += l; lq += l * l; lc++; }
          const lapVar = lq / lc - (ls / lc) * (ls / lc);
          const warns = []; if (lapVar < 40) warns.push('Foto tampak kurang tajam. Disarankan foto ulang agar nomor & nama terbaca jelas.'); if (short < 700) warns.push('Resolusi cukup rendah; pastikan tulisan masih terbaca.');
          /* thumbnail kecil untuk pratinjau & tinjauan admin (hemat penyimpanan browser) */
          const ts = Math.min(1, 480 / long), tc = document.createElement('canvas'); tc.width = Math.round(w * ts); tc.height = Math.round(h * ts); tc.getContext('2d').drawImage(im, 0, 0, tc.width, tc.height);
          return { stnk: { name: file.name, size: file.size, w, h, thumb: tc.toDataURL('image/jpeg', 0.6), warns, checkedAt: new Date().toISOString() } };
        } finally { URL.revokeObjectURL(url); }
      }
      const stnkBox = (v, i) => {
        if (v.stnk) {
          const s = v.stnk;
          return `<div class="stnk__ok"><img class="stnk__thumb" src="${s.thumb}" alt="Pratinjau foto STNK kendaraan ${i + 1}">
            <div class="stnk__meta"><span class="chip chip--success">${icon('check-circle', 'icon--16')}Lolos pemeriksaan awal</span>
              <b>${esc(s.name)}</b><span class="small muted">${s.w}×${s.h} px · ${(s.size / 1048576).toFixed(2)} MB</span>
              ${(s.warns || []).map(w => `<span class="stnk__warn small">${icon('alert', 'icon--16')}${esc(w)}</span>`).join('')}
              <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" class="btn btn--ghost btn--sm" data-replace="${v.id}">${icon('refresh', 'icon--16')}Ganti foto</button><button type="button" class="btn btn--ghost btn--sm" data-clear="${v.id}">${icon('trash', 'icon--16')}Hapus</button></div></div></div>`;
        }
        return `<label class="dropzone" for="${v.id}-stnk" style="display:block">${icon('image', 'icon--32')}<b>Pilih foto STNK</b> atau ambil dengan kamera<div class="help">JPG atau PNG · maks 5 MB · minimal ${STNK_RULE.minLong}×${STNK_RULE.minShort} px</div></label>`;
      };
      const vehCard = (v, i, n) => {
        const id = (k) => `${v.id}-${k}`;
        const err = (k) => `<span class="error-text" id="${id(k)}-e" role="alert">${icon('alert', 'icon--16')}<span></span></span>`;
        const fld = (k, label, inner, help) => `<div class="field"><label for="${id(k)}">${label}<span class="req" aria-hidden="true">*</span></label>${inner}${help ? `<span class="help" id="${id(k)}-h">${help}</span>` : ''}${err(k)}</div>`;
        const aria = (k, h) => `aria-describedby="${id(k)}-e${h ? ' ' + id(k) + '-h' : ''}"`;
        return `<fieldset class="veh" data-veh="${v.id}"><legend class="veh__head"><span class="veh__no">${icon('bike', 'icon--16')}Kendaraan ${i + 1}</span></legend>
          ${n > 1 ? `<button type="button" class="btn btn--ghost btn--sm veh__rm" data-remove="${v.id}" aria-label="Hapus kendaraan ${i + 1}">${icon('trash', 'icon--16')}Hapus</button>` : ''}
          ${fld('model', 'Model Ducati', `<select class="select" id="${id('model')}" data-v="${v.id}" data-k="model" required ${aria('model')}><option value="">Pilih model…</option>${MODELS.map(m => `<option ${v.model === m ? 'selected' : ''}>${m}</option>`).join('')}</select>`)}
          <div class="form-row form-row--2">${fld('year', 'Tahun kendaraan', `<input class="input" id="${id('year')}" data-v="${v.id}" data-k="year" type="number" min="1990" max="2027" inputmode="numeric" placeholder="2023" value="${esc(v.year)}" required ${aria('year')}>`)}${fld('color', 'Warna', `<input class="input" id="${id('color')}" data-v="${v.id}" data-k="color" placeholder="Merah" value="${esc(v.color)}" required ${aria('color')}>`)}</div>
          ${fld('plate', 'Nomor registrasi (plat)', `<input class="input" id="${id('plate')}" data-v="${v.id}" data-k="plate" placeholder="B 1234 XYZ" value="${esc(v.plate)}" autocapitalize="characters" style="text-transform:uppercase" required ${aria('plate', 1)}>`, 'Tidak akan ditampilkan di direktori publik.')}
          <div class="form-row form-row--2">
            ${fld('chassis', 'Nomor rangka (VIN)', `<input class="input" id="${id('chassis')}" data-v="${v.id}" data-k="chassis" placeholder="ZDM1234567890ABCD" value="${esc(v.chassis)}" autocapitalize="characters" style="text-transform:uppercase" required ${aria('chassis')}>`)}
            ${fld('engine', 'Nomor mesin', `<input class="input" id="${id('engine')}" data-v="${v.id}" data-k="engine" placeholder="ZDM1000W412345" value="${esc(v.engine)}" autocapitalize="characters" style="text-transform:uppercase" required ${aria('engine')}>`)}
          </div>
          <div class="field stnk"><span class="field-label" id="${id('stnk')}-l">Foto STNK<span class="req" aria-hidden="true">*</span></span>
            <div class="stnk__box" id="${id('stnk')}-box" aria-live="polite">${stnkBox(v, i)}</div>
            <input class="sr-only" type="file" id="${id('stnk')}" data-v="${v.id}" data-k="stnk" accept="image/jpeg,image/png" aria-labelledby="${id('stnk')}-l" aria-describedby="${id('stnk')}-e ${id('stnk')}-h">
            <span class="help" id="${id('stnk')}-h">Foto seluruh lembar STNK dari atas: tulisan jelas, tidak silau, semua sudut terlihat. Nomor pada foto harus sama dengan yang Anda isi.</span>${err('stnk')}</div></fieldset>`;
      };
      function s2() {
        const list = vehicles(), byId = (id) => list.find(x => x.id === id);
        const q = (v, k) => form.querySelector('#' + v.id + '-' + k);
        const draw = () => {
          form.innerHTML = `<div class="banner banner--info" style="margin-bottom:16px">${icon('shield')}<div><b>Boleh lebih dari satu Ducati</b>Tambahkan semua kendaraan Anda (maks ${MAX_VEH}). Setiap kendaraan memerlukan foto STNK yang diperiksa admin sebelum status kendaraan terverifikasi.</div></div>` +
            list.map((v, i) => vehCard(v, i, list.length)).join('') +
            `<button type="button" class="btn btn--secondary veh__add" data-add ${list.length >= MAX_VEH ? 'disabled' : ''}>${icon('plus', 'icon--16')}Tambah kendaraan${list.length >= MAX_VEH ? ' (batas tercapai)' : ''}</button>` + nav();
          wire();
        };
        const sync = (e) => { const t = e.target, v = t.dataset && t.dataset.v ? byId(t.dataset.v) : null; if (!v || !t.dataset.k || t.type === 'file') return; v[t.dataset.k] = ['plate', 'chassis', 'engine'].includes(t.dataset.k) ? t.value.toUpperCase() : t.value; save(); };
        async function onStnk(inp) {
          const v = byId(inp.dataset.v), file = inp.files[0]; if (!v || !file) return;
          const i = list.indexOf(v), box = form.querySelector('#' + v.id + '-stnk-box'); fieldErr(inp, '');
          box.innerHTML = `<div class="stnk__checking"><span class="spinner"></span><div><b>Memeriksa foto…</b><span class="small muted">Format, ukuran, resolusi, kecerahan & ketajaman.</span></div></div>`;
          const r = await checkStnk(file).catch(() => ({ error: 'Foto tidak bisa diproses. Coba pilih foto lain.' }));
          inp.value = '';
          const box2 = form.querySelector('#' + v.id + '-stnk-box'), inp2 = form.querySelector('#' + v.id + '-stnk'); if (!box2) { if (r.stnk) { v.stnk = r.stnk; save(); } return; }
          if (r.error) { box2.innerHTML = stnkBox(v, i); fieldErr(inp2, r.error); toast({ type: 'error', title: 'Foto STNK ditolak', msg: r.error }); return; }
          v.stnk = r.stnk; save(); box2.innerHTML = stnkBox(v, i); fieldErr(inp2, '');
          toast({ type: r.stnk.warns.length ? 'warning' : 'success', title: r.stnk.warns.length ? 'Foto STNK diterima dengan catatan' : 'Foto STNK diterima', msg: r.stnk.warns[0] || 'Lolos pemeriksaan awal. Admin akan memverifikasi kecocokan data.' });
        }
        function wire() {
          wireNav(() => {
            let ok = true; const seen = {};
            list.forEach((v, i) => {
              if (!v.model) { fieldErr(q(v, 'model'), 'Pilih model Ducati Anda.'); ok = false; }
              const y = +v.year; if (!v.year || y < 1990 || y > 2027) { fieldErr(q(v, 'year'), 'Isi tahun antara 1990–2027.'); ok = false; }
              if (!String(v.color).trim()) { fieldErr(q(v, 'color'), 'Warna wajib diisi.'); ok = false; }
              const pk = plateKey(v.plate);
              if (!pk) { fieldErr(q(v, 'plate'), 'Nomor registrasi wajib diisi.'); ok = false; }
              else if (!plateOk(v.plate)) { fieldErr(q(v, 'plate'), 'Format plat belum sesuai, mis. B 1234 XYZ.'); ok = false; }
              else if (seen[pk] !== undefined) { fieldErr(q(v, 'plate'), `Nomor ini sudah diisi di kendaraan ${seen[pk] + 1}.`); ok = false; }
              else { seen[pk] = i; v.plate = plateFmt(v.plate); }
              const ch = String(v.chassis || '').trim().toUpperCase();
              if (!ch) { fieldErr(q(v, 'chassis'), 'Nomor rangka wajib diisi.'); ok = false; }
              else if (ch.length < 5) { fieldErr(q(v, 'chassis'), 'Nomor rangka minimal 5 karakter.'); ok = false; }
              else { v.chassis = ch; }
              const en = String(v.engine || '').trim().toUpperCase();
              if (!en) { fieldErr(q(v, 'engine'), 'Nomor mesin wajib diisi.'); ok = false; }
              else if (en.length < 5) { fieldErr(q(v, 'engine'), 'Nomor mesin minimal 5 karakter.'); ok = false; }
              else { v.engine = en; }
              if (!v.stnk) { fieldErr(q(v, 'stnk'), 'Foto STNK wajib diunggah untuk setiap kendaraan.'); ok = false; }
            });
            if (!ok) { const first = list.map(v => form.querySelector('[data-veh="' + v.id + '"] .has-error')).find(Boolean); if (first) first.scrollIntoView({ block: 'center' }); }
            return ok;
          });
          const base = form.oninput; form.oninput = (e) => { sync(e); base(e); };
          form.onchange = (e) => { sync(e); if (e.target.type === 'file') onStnk(e.target); };
          form.onclick = async (e) => {
            const add = e.target.closest('[data-add]'), rm = e.target.closest('[data-remove]'), rp = e.target.closest('[data-replace]'), cl = e.target.closest('[data-clear]');
            if (add && list.length < MAX_VEH) { list.push(newVeh()); save(); draw(); form.querySelector('[data-veh]:last-of-type select')?.focus(); return; }
            if (rp) { form.querySelector('#' + rp.dataset.replace + '-stnk').click(); return; }
            if (cl) { const v = byId(cl.dataset.clear); v.stnk = null; save(); form.querySelector('#' + v.id + '-stnk-box').innerHTML = stnkBox(v, list.indexOf(v)); form.querySelector('#' + v.id + '-stnk').focus(); return; }
            if (rm) {
              const v = byId(rm.dataset.remove), i = list.indexOf(v);
              const filled = v.model || v.plate || v.stnk;
              if (filled && !(await confirmDialog({ title: `Hapus kendaraan ${i + 1}?`, body: 'Data dan foto STNK kendaraan ini akan dihapus dari formulir.', confirmText: 'Ya, hapus', danger: true }))) return;
              list.splice(i, 1); save(); draw(); toast({ type: 'success', msg: 'Kendaraan dihapus dari formulir.' });
            }
          };
        }
        draw();
      }
      /* Step 4 — chapter & dokumen */
      function docField(key, label, extra) {
        const f = draft.files[key];
        return `<div class="field" data-doc="${key}"><span class="field-label">${label}<span class="req" aria-hidden="true">*</span></span>
          <label class="dropzone" for="${key}" style="display:block">${icon('upload', 'icon--32')}<b>Pilih berkas</b> atau tarik ke sini<div class="help">JPG, PNG, atau PDF · maks 5 MB${extra || ''}</div></label>
          <input class="sr-only" type="file" id="${key}" accept="image/png,image/jpeg,application/pdf" aria-describedby="${key}-e">
          <div class="file-list" id="${key}-l">${f ? fileRow(f, 100) : ''}</div>
          <span class="error-text" id="${key}-e" role="alert">${icon('alert', 'icon--16')}<span></span></span></div>`;
      }
      const fileRow = (f, pct) => `<div class="file-row">${icon(pct === 100 ? 'check-circle' : 'file', 'icon--24')}<div class="grow"><b>${esc(f.name)}</b><span>${(f.size / 1024 / 1024).toFixed(2)} MB · ${pct === 100 ? 'Terunggah' : pct + '%'}</span>${pct < 100 ? `<div class="progress"><span style="width:${pct}%"></span></div>` : ''}</div></div>`;
      function s3() {
        form.innerHTML = `<div class="field"><label for="chapter">Chapter<span class="req" aria-hidden="true">*</span></label><select class="select" id="chapter" name="chapter" required aria-describedby="chapter-e"><option value="">Pilih chapter terdekat…</option>${D.CHAPTERS.map(c => `<option value="${c.id}" ${d().chapter === c.id ? 'selected' : ''}>${c.name} — ${c.city}</option>`).join('')}</select><span class="error-text" id="chapter-e" role="alert">${icon('alert', 'icon--16')}<span></span></span></div>` +
          F('referral', 'Referensi anggota', { req: false, value: d().referral || '', ph: 'Member ID atau nama (jika ada)' }) +
          `<div class="field"><label for="reason">Alasan bergabung <span class="muted small">(opsional)</span></label><textarea class="textarea" id="reason" name="reason" style="min-height:88px">${esc(d().reason || '')}</textarea></div>` +
          docField('docKtp', 'KTP') + docField('docSim', 'SIM C') + nav();
        ['docKtp', 'docSim'].forEach(key => {
          const inp = form.querySelector('#' + key), list = form.querySelector('#' + key + '-l');
          inp.addEventListener('change', () => {
            const file = inp.files[0]; if (!file) return;
            if (file.size > 5 * 1024 * 1024) return fieldErr(inp, 'Ukuran berkas melebihi 5 MB. Kompres dulu ya.');
            if (!/^(image\/(png|jpeg)|application\/pdf)$/.test(file.type)) return fieldErr(inp, 'Format harus JPG, PNG, atau PDF.');
            fieldErr(inp, ''); let p = 0; const meta = { name: file.name, size: file.size };
            const t = setInterval(() => { p = Math.min(100, p + 20 + Math.random() * 25); list.innerHTML = fileRow(meta, Math.round(p)); if (p >= 100) { clearInterval(t); draft.files[key] = meta; save(); list.innerHTML = fileRow(meta, 100); } }, 180);
          });
        });
        wireNav(() => {
          let ok = req('chapter', 'Pilih chapter Anda.');
          ['docKtp', 'docSim'].forEach(k => { const el = form.querySelector('#' + k); if (!draft.files[k]) { fieldErr(el, 'Dokumen ini wajib diunggah.'); ok = false; } });
          return ok;
        });
      }
      /* Step 5 — persetujuan */
      function s4() {
        const items = [['agreeArt', 'Saya telah membaca dan menyetujui <a href="dokumen.html" target="_blank">AD/ART</a> DOCI.'], ['agreeEtik', 'Saya menyetujui <a href="dokumen.html" target="_blank">Kode Etik Anggota</a>, termasuk aturan keselamatan berkendara.'], ['agreePriv', 'Saya menyetujui <a href="dokumen.html" target="_blank">Kebijakan Privasi</a> dan pemrosesan data pribadi sesuai UU PDP.'], ['agreeTruth', 'Saya menyatakan seluruh data yang saya isi adalah benar.']];
        form.innerHTML = `<div class="banner banner--info" style="margin-bottom:16px">${icon('shield')}<div><b>Jejak persetujuan tercatat</b>Waktu & versi dokumen disimpan untuk audit (v2024.1 · ${fmt.date(new Date())}).</div></div>` +
          items.map(([n, t]) => `<div class="field" style="margin:0"><label class="check"><input type="checkbox" name="${n}" ${draft.agree[n] ? 'checked' : ''} aria-describedby="${n}-e"><span>${t}</span></label><span class="error-text" id="${n}-e" role="alert">${icon('alert', 'icon--16')}<span>Centang untuk melanjutkan.</span></span></div>`).join('') + nav();
        wireNav(() => { let ok = true; items.forEach(([n]) => { const el = form.querySelector(`[name=${n}]`); fieldErr(el, el.checked ? '' : 'x'); if (!el.checked) ok = false; }); return ok; });
      }
      /* Step 6 — ringkasan */
      function s5() {
        const c = D.CHAPTERS.find(x => x.id === d().chapter);
        form.innerHTML = `<dl class="kv"><div><dt>Nomor telepon</dt><dd class="mono">${fmt.phone(draft.phone)}</dd></div><div><dt>Nama</dt><dd>${esc(d().fullName)}</dd></div><div><dt>Kota</dt><dd>${esc(d().city)}</dd></div><div><dt>Kendaraan (${vehicles().length})</dt><dd>${vehicles().map(v => `<div class="sum-veh">${esc(bikeLabel(v))}<span class="small muted">Plat: ${esc(v.plate)} · Rangka: ${esc(v.chassis || '—')} · Mesin: ${esc(v.engine || '—')} · STNK ${v.stnk ? 'terunggah' : 'belum ada'}</span></div>`).join('')}</dd></div><div><dt>Chapter</dt><dd>${c ? c.name : '-'}</dd></div><div><dt>Dokumen</dt><dd>KTP & SIM C terunggah · ${vehicles().filter(v => v.stnk).length} STNK menunggu verifikasi admin</dd></div></dl>
        <h3 style="margin:24px 0 8px;font-size:17px">Rincian Biaya</h3>
        <dl class="kv kv--total"><div><dt>Biaya join (pendaftaran + iuran 12 bulan pertama)</dt><dd class="num">Rp 1.500.000</dd></div><div><dt>Total</dt><dd class="num">Rp 1.500.000</dd></div></dl>
        <p class="help" style="margin-top:8px">Biaya layanan metode pembayaran (jika ada) ditampilkan di langkah berikutnya. Pembayaran otomatis — tidak perlu unggah bukti transfer.</p>
        <div class="form-actions form-actions--sticky"><button type="button" class="btn btn--ghost" data-back>${icon('chev-left', 'icon--16')}Kembali</button><button class="btn btn--lg" type="submit">Bayar Rp 1.500.000</button></div>`;
        form.querySelector('[data-back]').onclick = () => { draft.step--; save(); render(); };
        form.onsubmit = (e) => {
          e.preventDefault(); const b = form.querySelector('[type=submit]'); b.setAttribute('aria-busy', 'true'); b.textContent = 'Memproses…';
          const now = new Date(), seq = String(Math.floor(10000 + Math.random() * 89999));
          const inv = { id: 'INV/DOCI/' + now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + '/' + seq, regNo: 'REG-' + String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, '0') + '-' + seq, type: 'membership', title: 'Membership Baru DOCI', phone: draft.phone,
            items: [{ label: 'Biaya join (pendaftaran + iuran 12 bulan pertama)', amount: 1500000 }], amount: 1500000, status: 'menunggu', created: now.toISOString(), expires: new Date(now.getTime() + 24 * 3600 * 1000).toISOString(),
            profile: Object.assign({}, draft.data, { phone: draft.phone }, { model: vehicles()[0].model, year: vehicles()[0].year, color: vehicles()[0].color, plate: vehicles()[0].plate, chassis: vehicles()[0].chassis, engine: vehicles()[0].engine, vehicles: vehicles().map(v => ({ id: v.id, model: v.model, year: v.year, color: v.color, plate: v.plate, chassis: v.chassis, engine: v.engine, stnk: v.stnk ? Object.assign({}, v.stnk, { status: 'menunggu' }) : null })) }) };
          const all = Store.get('invoices', []); all.unshift(inv); Store.set('invoices', all);
          Audit.log('buat invoice', inv.id, null, { status: 'menunggu' });
          setTimeout(() => { location.href = 'bayar.html?inv=' + encodeURIComponent(inv.id); }, 500);
        };
      }
      if (draft.step > 0 && !draft.phone) draft.step = 0;
      render();
    })();
  </script>
</body>
</html>
